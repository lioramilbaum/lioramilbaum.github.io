name: Check site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: .
          destination: ./_site

      - name: Check site
        shell: bash
        run: bash scripts/check-site.sh _site

      - name: Snapshot smoke test
        id: smoke
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m http.server 4000 --directory _site >/dev/null 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:4000/
          bash scripts/snapshot-site.sh http://host.docker.internal:4000 "$RUNNER_TEMP/snapshots"
          echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload site preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview-${{ steps.smoke.outputs.short }}
          path: ${{ runner.temp }}/snapshots/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  delivery-doc:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent (the base branch tip).
          fetch-depth: 2
          persist-credentials: false

      - name: Test delivery check
        # Tests the checker itself, so it runs on Renovate PRs too.
        shell: bash
        run: bash scripts/test-check-delivery.sh

      - name: Check delivery doc
        # Renovate PRs automerge once checks pass and carry no delivery doc.
        if: github.event.pull_request.user.login != 'renovate[bot]'
        shell: bash
        run: bash scripts/check-delivery.sh HEAD^1 HEAD
