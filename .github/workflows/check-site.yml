name: Check site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its base-branch parent, for the snapshot script check.
          fetch-depth: 2
          persist-credentials: false

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: .
          destination: ./_site

      - name: Check site
        shell: bash
        run: bash scripts/check-site.sh _site

      - name: Check workflow files
        # Ruby in the Jekyll image the build step pulled; no network.
        shell: bash
        run: bash scripts/check-workflows.sh

      - name: Browser check
        # Playwright (pinned in snapshot-site.sh), JavaScript off, light and dark.
        # On a PR, HEAD^1 is the base branch, so the diff covers the whole PR. Any
        # other event (a manual run) always runs the check.
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] &&
             git diff --quiet HEAD^1 HEAD -- _layouts docs README.md _config.yml assets \
               .github/workflows/check-site.yml scripts/check-browser.sh scripts/check-browser \
               scripts/snapshot-site.sh; then
            echo "pages and browser check unchanged in this PR; skipping the browser check"
          else
            bash scripts/check-browser.sh _site
          fi

      - name: Install jq
        # scripts/test-delivery.sh filters its gh stub's output with jq.
        shell: bash
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }

      - name: Test delivery scripts
        # Tests the generator and the check themselves, so it runs on Renovate PRs too.
        shell: bash
        run: bash scripts/test-delivery.sh

      - name: Snapshot script test
        # Runs only when this PR changes scripts/snapshot-site.sh, which includes
        # Renovate's Playwright pin bumps.
        shell: bash
        run: |
          if git diff --quiet HEAD^1 HEAD -- scripts/snapshot-site.sh; then
            echo "scripts/snapshot-site.sh is unchanged; skipping the snapshot test"
          else
            bash scripts/test-delivery.sh --snapshot
          fi

      - name: Check external links
        # Third-party sites: a dead link warns and does not block. A failing job
        # would stall Renovate automerge and the delivery-doc generator.
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        # No GITHUB_TOKEN: the script comes from the PR. The comment lookups use the
        # unauthenticated API (60 requests an hour per IP); a rate limit only warns.
        run: bash scripts/check-links.sh

  delivery-doc:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its parents: the PR head is the second parent.
          fetch-depth: 2
          persist-credentials: false

      - name: Check the delivery doc
        # Renovate PRs automerge once checks pass and carry no delivery doc.
        if: github.event.pull_request.user.login != 'renovate[bot]'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/check-delivery.sh
