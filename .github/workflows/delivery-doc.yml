name: Delivery doc

# AGENTS.md rule 6: after a code PR merges to main, generates its delivery doc and adds it to the
# docs PR (one commit, changing only deliveries/) that the owner merges. scripts/delivery-run.sh
# does the work; this file runs it from main on a push to main and on a manual dispatch. Two PATs
# (AGENTS.md Setup) are set on the one run step only: AGENT_FORK_TOKEN pushes the docs branch to
# the fork and fast-forwards the fork's main to upstream's before that push,
# and AGENT_PR_TOKEN opens and edits the docs PR, so CI runs on it (GITHUB_TOKEN would not start
# Check site).
# Nothing here merges, posts to the discussions, or touches a Qodo finding.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr:
        description: PR number whose delivery doc to generate
        required: true
        type: string

permissions:
  contents: read
  # Qodo's review is an issue comment on the PR.
  issues: read
  pull-requests: read
  actions: read

jobs:
  generate:
    # Only this repository's main: a fork's push or a run from another branch does nothing. Renovate's merges
    # to main (pushed by renovate[bot], the push's actor) do not start the job; a dispatch by the owner still
    # runs, and scripts/delivery-run.sh still skips a dispatched Renovate PR, logged (AGENTS.md rule 6).
    if: >-
      github.repository == 'lioramilbaum/lioramilbaum.github.io' &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'renovate[bot]'
    # One run at a time, none cancelled, each waiting run queued (FIFO): two merges within a minute
    # both land in one docs PR, because the second run starts after the first has opened it. On the
    # job, so a run whose if: skips the job never joins the queue.
    concurrency:
      group: delivery-doc
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-26.04
    # Qodo's final review can take up to 20 minutes after the merge (scripts/delivery-run.sh polls
    # for it); the checkout, two builds, the screenshot and the check take the rest.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the merge commit's PR, its base and its head are fetched from origin.
          fetch-depth: 0
          persist-credentials: false

      - name: Install jq
        # Required: scripts/delivery-run.sh runs standalone jq (to count and filter the open PRs, from gh pr
        # list's JSON), so the step must install it on a runner image that lacks jq.
        shell: bash
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }

      - name: Generate the delivery doc
        # The two PATs reach this step only. AGENT_FORK_TOKEN also pushes the fork's main (the sync), and
        # is given to git only through askpass on a push. The script removes
        # them from its environment before it runs any script, git command or build, so none of them
        # inherits them (its first lines, the cd through dirname, run before the removal and see them).
        # Code running as the same user could still read them from /proc, and every script the run
        # executes is code already merged to main.
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ github.token }}
          AGENT_FORK_TOKEN: ${{ secrets.AGENT_FORK_TOKEN }}
          AGENT_PR_TOKEN: ${{ secrets.AGENT_PR_TOKEN }}
          # The generator's preview server must be reachable through host-gateway from the
          # screenshot container, which needs every interface on native Linux (AGENTS.md Setup).
          SERVE_HOST: 0.0.0.0
        run: bash scripts/delivery-run.sh --event "$EVENT" --sha "$SHA" --pr "$PR"
