name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: .
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    needs: package
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  snapshot:
    needs: deploy
    # The lmilbaum fork also deploys Pages on main; only snapshot the real site.
    if: github.repository == 'lioramilbaum/lioramilbaum.github.io'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The site is already live; a failed snapshot must not fail the deploy run.
    continue-on-error: true
    # Replaces the workflow-level pages/id-token grants for this job.
    permissions:
      contents: read
      deployments: read
    env:
      SITE_URL: https://lioramilbaum.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for the live site to serve this deploy
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the newest github-pages deployment may be captured. A re-run of an
          # older run after a newer deploy would otherwise label that newer page
          # with this commit, so skip instead. Sort by created_at rather than
          # trusting the API's ordering.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=10" --jq 'sort_by(.created_at) | last | .sha // empty')
          [[ -n "$latest" ]] || { echo "::error::no github-pages deployment found" >&2; exit 1; }
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "::notice::a newer deploy (${latest::7}) is live, so a snapshot of $GITHUB_SHA would not match its commit; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          created_at=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&sha=$GITHUB_SHA&per_page=1" --jq '.[0].created_at // empty')
          [[ -n "$created_at" ]] || { echo "::error::no github-pages deployment found for $GITHUB_SHA" >&2; exit 1; }

          # Pages stamps Last-Modified with the deploy time. Wait until the
          # homepage is at least that new. Each attempt uses a unique query and
          # no-cache header so a stale CDN entry cannot pass.
          want=$(date -u -d "$created_at" +%s)
          ready=0
          for attempt in $(seq 1 30); do
            lm=$(curl -fsSI -H 'Cache-Control: no-cache' "$SITE_URL/?snapshot=$GITHUB_SHA-$attempt" | tr -d '\r' | sed -n 's/^[Ll]ast-[Mm]odified: //p') || lm=""
            if [[ -n "$lm" ]] && (( $(date -u -d "$lm" +%s) >= want )); then
              ready=1
              echo "live site serves a build from $lm or later"
              break
            fi
            echo "/ not at deploy $GITHUB_SHA yet (last-modified: ${lm:-none})"
            sleep 10
          done
          if (( ready == 0 )); then
            echo "::error::live site did not serve deploy $GITHUB_SHA (created $created_at) within 5 minutes" >&2
            exit 1
          fi

          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Re-run attempts are not guaranteed to queue behind a newer deploy, so this
      # step re-checks the newest deployment immediately before capture. The window
      # between this check and the capture is short (the capture takes about a
      # minute) but not zero.
      - name: Confirm this commit is still the latest deploy
        id: confirm
        if: steps.live.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=10" --jq 'sort_by(.created_at) | last | .sha // empty')
          [[ -n "$latest" ]] || { echo "::error::no github-pages deployment found" >&2; exit 1; }
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "::notice::a newer deploy (${latest::7}) is live, so a snapshot of $GITHUB_SHA would not match its commit; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Capture screenshots
        if: steps.live.outputs.skip == 'false' && steps.confirm.outputs.skip == 'false'
        run: bash scripts/snapshot-site.sh "$SITE_URL" "$RUNNER_TEMP/snapshots" "snapshot=$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Upload snapshots
        if: steps.live.outputs.skip == 'false' && steps.confirm.outputs.skip == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-snapshots-${{ steps.live.outputs.short }}
          path: ${{ runner.temp }}/snapshots/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
